name: demo1-retail-agent-langraph-responses
description: >
  Retail Agent written using LangGraph (demo1 redeploy, Responses protocol).
metadata:
  tags:
    - AI Agent Hosting
    - Azure AI AgentServer
    - LangGraph
    - LangChain
template:
  name: demo1-retail-agent-langraph-responses
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_OPENAI_ENDPOINT
      value: ${AZURE_OPENAI_ENDPOINT}
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{chat}}"
resources:
  - kind: model
    id: gpt-5.5-1
    name: chat
