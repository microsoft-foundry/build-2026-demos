# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: ai-foundry-starter-basic
services:
    demo1-retail-agent-langraph-responses:
        project: src/demo1-retail-agent-langraph-responses
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "1"
                    memory: 2Gi
            deployments:
                - model:
                    format: OpenAI
                    name: gpt-5.5
                    version: "2026-04-24"
                  name: gpt-5.5-1
                  sku:
                    capacity: 5000
                    name: GlobalStandard
            startupCommand: python main.py
    retail-agent-langgraph:
        project: src/retail-agent-langgraph
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "1"
                    memory: 2Gi
            deployments:
                - model:
                    format: OpenAI
                    name: gpt-5.4
                    version: "2026-03-06"
                  name: gpt-5.4
                  sku:
                    capacity: 5000
                    name: GlobalStandard
            startupCommand: python main.py
infra:
    provider: bicep
    path: ./infra
